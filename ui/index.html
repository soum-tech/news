<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports news</title>
<style>
  :root { --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e2dfd8; --accent:#8a1c1c; --ok:#2d6a3e; --warn:#9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#161614; --panel:#1f1f1c; --ink:#ece9e1; --muted:#9b988f; --line:#33322e; --accent:#e07a7a; --ok:#7fc08f; --warn:#e0b070; }
  }
  :root[data-theme="dark"] { --bg:#161614; --panel:#1f1f1c; --ink:#ece9e1; --muted:#9b988f; --line:#33322e; --accent:#e07a7a; --ok:#7fc08f; --warn:#e0b070; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 Georgia, "Times New Roman", serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 16px 40px; }
  header { padding:22px 0 10px; }
  h1 { margin:0; font-size:44px; letter-spacing:.14em; text-transform:uppercase; }
  .sub { display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:var(--muted); font:14px system-ui, sans-serif; margin-top:6px; }
  select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
  nav { position:sticky; top:0; z-index:2; background:var(--bg); padding:10px 0; border-bottom:2px solid var(--ink); display:flex; flex-wrap:wrap; gap:8px; }
  nav button { font:600 14px system-ui, sans-serif; padding:6px 13px; border:1px solid var(--line); border-radius:99px; background:var(--panel); color:var(--ink); cursor:pointer; text-transform:capitalize; }
  nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  nav button span { opacity:.65; margin-left:5px; font-weight:400; }
  h2.topic { font-size:26px; margin:26px 0 4px; text-transform:capitalize; }
  .story { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin:14px 0; }
  .story h3 { margin:0 0 4px; font-size:21px; line-height:1.3; }
  .meta { color:var(--muted); font:13px system-ui, sans-serif; margin-bottom:10px; }
  .chip { display:inline-block; font:12px system-ui, sans-serif; padding:1px 8px; margin:0 4px 0 0; border:1px solid var(--line); border-radius:99px; color:var(--muted); }
  .chip.ok { color:var(--ok); border-color:var(--ok); }
  .chip.warn { color:var(--warn); border-color:var(--warn); }
  .summary { margin:8px 0; }
  .why { color:var(--muted); font-style:italic; margin:6px 0; }
  ul.kp { margin:6px 0 4px 18px; padding:0; }
  h4 { margin:18px 0 8px; font:700 12px system-ui, sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .people { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
  .person { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:11px 13px; background:var(--bg); font-size:14.5px; }
  .person .name { font-weight:bold; font-size:16px; }
  .person .role { color:var(--muted); font:13px system-ui, sans-serif; margin-bottom:6px; }
  .person p { margin:6px 0; }
  .person ul { margin:4px 0 4px 18px; padding:0; }
  .person .lab { font:700 11px system-ui, sans-serif; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:8px; }
  .src { margin-top:8px; font:12px system-ui, sans-serif; color:var(--muted); }
  .src a { color:var(--accent); }
  .nopro { color:var(--muted); font:13px system-ui, sans-serif; margin-top:6px; }
  details { margin-top:14px; font:14px system-ui, sans-serif; }
  details summary { cursor:pointer; color:var(--muted); }
  details p, details li { font:14px/1.5 Georgia, serif; }
  .text { white-space:pre-wrap; max-height:260px; overflow:auto; margin-top:6px; }
  .empty { color:var(--muted); padding:40px 0; font:15px system-ui, sans-serif; }
  .note { color:var(--muted); font:12.5px system-ui, sans-serif; margin-top:22px; }
  @media (max-width:600px) { h1 { font-size:32px; } .story { padding:13px 13px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Sports</h1>
    <div class="sub"><span id="paper"></span><select id="day" title="paper date"></select><select id="cls" title="section" hidden></select></div>
  </header>
  <nav id="topics"></nav>
  <main id="main"><div class="empty">Loading...</div></main>
  <p class="note">Summaries are written by a small model that reads the newspaper text. Background on people comes from Wikipedia at the time shown on each card and may be out of date. Anything marked "verify" has a number that was not found in its source.</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = (s) => String(s || "").replace(/_/g, " ");
let topics = [], current = "all";

async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

async function init() {
  const classes = await api("/api/classes");
  const sel = $("cls");
  sel.innerHTML = (classes.length ? classes : ["sports"]).map((c) => `<option>${esc(c)}</option>`).join("");
  sel.hidden = classes.length < 2;                       // shown only when there is more than one section
  await loadDays();
}

async function loadDays() {
  const cls = $("cls").value;
  $("title").textContent = cls;
  document.title = `${cls} news`;
  const days = await api(`/api/days?class=${encodeURIComponent(cls)}`);
  $("day").innerHTML = days.length
    ? days.slice().reverse().map((d) => `<option value="${esc(d.date)}">${esc(d.date)}</option>`).join("")
    : `<option value="">no stored days</option>`;
  await loadTopics();
}

async function loadTopics() {
  const day = $("day").value;
  current = "all";
  if (!day) { topics = []; render(); return; }
  topics = await api(`/api/topics?class=${encodeURIComponent($("cls").value)}&date=${day}`);
  const first = topics[0]?.articles[0];
  $("paper").textContent = first ? `${first.paper} (${first.edition})` : "";
  render();
}

function renderNav() {
  const total = topics.reduce((n, t) => n + t.count, 0);
  const btn = (key, label, n) => `<button data-t="${esc(key)}" class="${current === key ? "on" : ""}">${esc(label)}<span>${n}</span></button>`;
  $("topics").innerHTML = topics.length ? btn("all", "all", total) + topics.map((t) => btn(t.name, t.name, t.count)).join("") : "";
  $("topics").querySelectorAll("button").forEach((b) => b.onclick = () => { current = b.dataset.t; render(); window.scrollTo(0, 0); });
}

function person(p) {
  const pr = p.profile || {};
  const facts = (p.in_article || []).map((f) => `<li>${esc(f.what)}: <b>${esc(f.value)}</b>${f.note ? ` (${esc(f.note)})` : ""}</li>`).join("");
  const link = pr.url && pr.url.startsWith("https://en.wikipedia.org/") ? `<a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.title)}</a>` : esc(pr.title || "");
  return `<div class="person">
    <div class="name">${esc(p.name)} ${pr.found && pr.sport ? `<span class="chip">${esc(cap(pr.sport))}</span>` : ""}</div>
    <div class="role">${esc([p.role, p.affiliation].filter(Boolean).join(" · "))}</div>
    ${facts ? `<div class="lab">In this news</div><ul>${facts}</ul>` : ""}
    ${pr.found ? `
      ${pr.background ? `<div class="lab">Background</div><p>${esc(pr.background)}</p>` : ""}
      ${(pr.records || []).length ? `<div class="lab">Record</div><ul>${pr.records.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
      ${pr.current_status ? `<div class="lab">Now</div><p>${esc(pr.current_status)}</p>` : ""}
      <div class="src">Source: ${link} (Wikipedia, fetched ${esc(pr.fetched)}; may be out of date)
        ${pr.verify ? `<span class="chip warn" title="numbers not found in the source: ${esc((pr.unmatched_numbers || []).join(", "))}">verify</span>` : ""}</div>`
    : `<div class="nopro">No background found${pr.reason ? ": " + esc(pr.reason) : ""}.</div>`}
  </div>`;
}

function story(a) {
  const f = a.facts || {}, m = a.meaning || {};
  const summary = m.summary || f.gist || "";
  const sug = (a.suggestions || []);
  const place = [a.dateline_place, a.dateline_date].filter(Boolean).join(", ");
  return `<article class="story">
    <h3>${esc(a.headline)}</h3>
    <div class="meta">${esc(a.paper)} · ${esc(a.paper_date)} · page ${a.page}${place ? " · " + esc(place) : ""}
      ${f.competition ? ` · ${esc(f.competition)}` : ""}</div>
    <div>${f.status ? `<span class="chip">${esc(cap(f.status))}</span>` : ""}${f.story_type ? `<span class="chip">${esc(cap(f.story_type))}</span>` : ""}
      ${f.winner ? `<span class="chip ok">winner: ${esc(f.winner)}</span>` : ""}</div>
    ${summary ? `<p class="summary">${esc(summary)}</p>` : `<p class="nopro">No summary yet: run understand.py for this day.</p>`}
    ${m.why_it_matters ? `<p class="why">${esc(m.why_it_matters)}</p>` : ""}
    ${(m.key_points || []).length ? `<ul class="kp">${m.key_points.map((k) => `<li>${esc(k)}</li>`).join("")}</ul>` : ""}
    ${(a.people || []).length ? `<h4>People in this news</h4><div class="people">${a.people.map(person).join("")}</div>` : ""}
    ${sug.length ? `<details><summary>Suggestions (${sug.length})</summary><ul>${sug.map((s) => `<li><b>${esc(cap(s.category))}: ${esc(s.title)}.</b> ${esc(s.detail)}${s.verify ? ` <span class="chip warn">verify</span>` : ""}</li>`).join("")}</ul></details>` : ""}
    <details><summary>Newspaper text</summary><div class="text">${esc(a.text)}</div></details>
  </article>`;
}

function render() {
  renderNav();
  if (!topics.length) { $("main").innerHTML = `<div class="empty">Nothing stored for this day yet. Run the pipeline first.</div>`; return; }
  const shown = current === "all" ? topics : topics.filter((t) => t.name === current);
  $("main").innerHTML = shown.map((t) => `<section><h2 class="topic">${esc(t.name)}</h2>${t.articles.map(story).join("")}</section>`).join("");
}

$("cls").onchange = loadDays;
$("day").onchange = loadTopics;
init().catch((e) => { $("main").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
</script>
</body>
</html>
